name: Build AppImage

on:
  # Pushed by publish.sh: an annotated `build-<ref>` tag triggers a build of
  # that dia ref; the release is tagged with the version from dia's meson.build.
  push:
    tags: ["build-*"]

# The publish step creates/updates releases with the built-in GITHUB_TOKEN.
permissions:
  contents: write

# One build at a time; never cancel a release upload in flight.
concurrency:
  group: build-appimage
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      # The whole build happens inside Docker (image compiles libxml2 +
      # xpm-pixbuf, clones dia, builds and verifies the AppImage); the runner
      # itself only needs Docker, which the hosted runners ship preinstalled.
      # The dia ref comes from the trigger tag name (build-<ref>).
      - name: Build AppImage (Docker)
        env:
          DIA_REF: ${{ github.ref_name }}
        run: |
          export DIA_REF="${DIA_REF#build-}"
          echo "Building dia ref: $DIA_REF"
          ./run.sh

      - name: Generate SHA256SUMS
        run: |
          cd output
          sha256sum -- *.AppImage > SHA256SUMS
          cat SHA256SUMS

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          dia_ref="${GITHUB_REF_NAME#build-}"
          appimage=$(ls output/*.AppImage)
          # The version comes from dia's meson.build (parsed into the
          # artifact name by build-appimage.sh); it names the release tag.
          version=$(basename "$appimage" | sed -n 's/^dia-\(.*\)-x86_64\.AppImage$/\1/p')
          [ -n "$version" ] || { echo "could not parse version from $appimage" >&2; exit 1; }
          tag="$version"
          {
            echo "Automated build of Dia ${version} (x86_64 AppImage) from [gnome/dia](https://github.com/gnome/dia) ref \`${dia_ref}\`."
            echo
            echo "Built from this repository at \`${GITHUB_SHA}\`."
            echo
            echo '```'
            cat output/SHA256SUMS
            echo '```'
          } > notes.md
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$appimage" output/SHA256SUMS --clobber
          else
            gh release create "$tag" "$appimage" output/SHA256SUMS \
              --title "Dia ${version} (x86_64)" \
              --notes-file notes.md
          fi
          echo "Release: https://github.com/${GITHUB_REPOSITORY}/releases/tag/${tag}"
